<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agente de Control de Luces - GrandMA2</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #222;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      text-align: center;
      padding: 2rem;
      max-width: 680px;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 1.75rem 0;
    }

    #btn-probar-grupo1 {
      background-color: #2ea043;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 1.15rem 2.25rem;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    #btn-probar-grupo1:hover {
      background-color: #3fb950;
    }

    #btn-probar-grupo1:active {
      transform: scale(0.98);
    }

    #salida-respuesta {
      margin-top: 1.75rem;
      padding: 1rem;
      background-color: #161616;
      border: 1px solid #444;
      border-radius: 8px;
      text-align: left;
      font-size: 0.9rem;
      color: #d0f5d8;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 4rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Backend MA2 Activo - Esperando la UI de Milene</h1>
    <button id="btn-probar-grupo1" type="button">Probar Grupo 1 al 50%</button>
    <pre id="salida-respuesta">Esperando clic para probar la comunicación IPC...</pre>
  </main>

  <script>
    const botonPrueba = document.getElementById('btn-probar-grupo1');
    const contenedorRespuesta = document.getElementById('salida-respuesta');

    botonPrueba.addEventListener('click', async () => {
      const cargaUtil = {
        accion: "encender",
        grupo: "1",
        valor: "50",
        tipo: "intensidad"
      };

      try {
        const respuesta = await window.api.enviarComandoLuces(cargaUtil);
        const textoFormateado = JSON.stringify(respuesta, null, 2);
        contenedorRespuesta.textContent = textoFormateado;
        alert(`Respuesta IPC (${respuesta.exito ? 'OK' : 'ERROR'}):\n${textoFormateado}`);
      } catch (error) {
        const mensajeError = error instanceof Error ? error.message : String(error);
        contenedorRespuesta.textContent = `Error en la prueba IPC: ${mensajeError}`;
        alert(`Error en la prueba IPC: ${mensajeError}`);
      }
    });
  </script>
</body>
</html>
